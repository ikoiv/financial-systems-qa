name: Ledger and SQL tests
# Run on changes and allow a manual run from the Actions tab.
on: [push, pull_request, workflow_dispatch]
# These checks only need to read repository contents; no write token is necessary.
permissions:
  contents: read
jobs:
  test:
    # Exercise the same ledger and SQL checks on two Python runtimes.
    strategy:
      matrix:
        python: ['3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
